# Tempo: stores traces and answers trace queries (TraceQL) for Grafana.
# Single-binary mode with local disk: fine for one machine; at scale Tempo
# runs as separate components on object storage (S3, GCS).

server:
  http_listen_port: 3200
  grpc_listen_port: 9096

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317 # the collector sends here

querier:
  frontend_worker:
    frontend_address: 127.0.0.1:9096

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# How long traces are kept (Tempo 3 moved this from `compactor` to the
# backend worker, which compacts and deletes old blocks).
backend_worker:
  compaction:
    block_retention: 72h

# Turns traces into metrics: the service graph Grafana draws (which service
# calls which, with rates and errors), written to Prometheus.
metrics_generator:
  processor:
    service_graphs:
      dimensions: [service.name]
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs]
