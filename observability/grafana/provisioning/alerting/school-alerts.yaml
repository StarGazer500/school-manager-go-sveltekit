# Grafana alert rules for the School API, loaded at startup ("as code").
# See them in Grafana: Alerting → Alert rules → School.
#
# How a rule works: query A asks Prometheus for one number, expression C
# compares it with a threshold, and the alert fires only if C stays true for
# the whole `for` period, so a short spike doesn't wake anyone.
#
# No contact point (email, Slack...) is configured here, so firing alerts show
# in Grafana only. Add one under Alerting → Contact points to get notified.
#
# Changing this file needs a Grafana restart: `make -C observability restart`.
#
# __dashboardUid__ + __panelId__ make the alert link straight to the chart
# that shows the problem (panel ids are in dashboards/school-api-overview.json).
apiVersion: 1

groups:
  - orgId: 1
    name: school-api
    folder: School
    interval: 1m
    rules:
      - uid: school-api-error-rate
        title: High error rate (5xx)
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                (sum(rate(http_server_request_duration_seconds_count{service_name="school-api", http_response_status_code=~"5.."}[5m])) or vector(0))
                / sum(rate(http_server_request_duration_seconds_count{service_name="school-api"}[5m]))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.05] }
        for: 5m
        noDataState: OK # no traffic means no errors
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: More than 5% of API requests are failing with 5xx
          description: >-
            Error rate is {{ humanizePercentage $values.A.Value }}. Open the School API dashboard,
            check "5xx errors by route", then "Recent failed requests" for the traces.
          __dashboardUid__: school-api-overview
          __panelId__: "10"

      - uid: school-api-latency
        title: Slow responses (p95 > 500 ms)
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                histogram_quantile(0.95,
                  sum by (le) (rate(http_server_request_duration_seconds_bucket{service_name="school-api"}[5m])))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.5] }
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 95% of API requests take longer than 500 ms
          description: >-
            p95 latency is {{ humanizeDuration $values.A.Value }}. On the dashboard, "Latency p95 by
            route" shows which route; click an exemplar dot for a slow request's trace.
          __dashboardUid__: school-api-overview
          __panelId__: "9"

      - uid: school-api-down
        title: API down
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              # Prometheus scrapes the API's /metrics every 15s and records
              # up=1 when it answers, up=0 when it doesn't. min() over 1m
              # ignores a single missed scrape.
              expr: min_over_time(up{job="school-api"}[1m])
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
        for: 1m
        noDataState: Alerting # no `up` at all means the scrape target itself is gone
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: Prometheus can't reach the School API
          description: >-
            The API's metrics endpoint (host.docker.internal:9464/metrics) hasn't answered for
            2 minutes: the API is down, or METRICS_PORT doesn't match prometheus/prometheus.yml.

      - uid: school-api-db-pool
        title: Database connection pool saturated
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                max(pgxpool_acquired_connections{service_name="school-api"})
                / max(pgxpool_max_connections{service_name="school-api"})
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.9] }
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: Over 90% of database connections are in use
          description: >-
            Requests will start queueing for a connection. Look for slow queries ("Query duration p95")
            or raise the pool size (pool_max_conns in DATABASE_URL).
          __dashboardUid__: school-api-overview
          __panelId__: "18"
