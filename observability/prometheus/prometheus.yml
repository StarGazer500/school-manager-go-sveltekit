# Prometheus: stores metrics and answers PromQL queries for Grafana and the
# alert rules. It *pulls*: every 15s it scrapes each target's /metrics, and
# records `up` = 1 if the scrape worked, 0 if not. `up` is what the
# "API down" alert watches.
#
# Retention and features are command-line flags, in docker-compose.yml.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # The Go API. It runs on the host (`make dev`), not in Docker, so it's
  # reached through host.docker.internal; METRICS_PORT defaults to 9464.
  - job_name: school-api
    static_configs:
      - targets: ["host.docker.internal:9464"]

  # The stack watching itself: if the collector drops data or Tempo and Loki
  # struggle, it shows up here (e.g. otelcol_exporter_send_failed_spans_total).
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
