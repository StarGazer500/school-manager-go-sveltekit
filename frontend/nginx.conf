# Serves the static build (frontend/build) and forwards /api to the Go API,
# so the browser only ever talks to one origin. Example for a container:
#   COPY build/ /usr/share/nginx/html/
#   COPY nginx.conf /etc/nginx/conf.d/default.conf
server {
	listen 80;
	root /usr/share/nginx/html;

	# The Go API. Change "api:8080" to wherever the backend runs.
	location /api/ {
		proxy_pass http://api:8080;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	}

	# Hashed file names never change, so browsers may cache them for a year.
	location /_app/immutable/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
	}

	# Any other URL (/students/3, ...) gets the SPA shell; the router renders it.
	location / {
		try_files $uri $uri/ /200.html;
	}
}
