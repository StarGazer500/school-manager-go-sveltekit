name: school-manager

# Local development services. Start them with `make db-up`.
# The ports are moved off the defaults (5432, 6379) so they don't clash with
# another Postgres or Redis already running on this machine.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: school
      POSTGRES_PASSWORD: school
      POSTGRES_DB: school
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      # Postgres 18 images keep their data under /var/lib/postgresql/<version>.
      - school-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school -d school"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Cache only: everything in it can be rebuilt from Postgres, so it keeps no
  # data on disk and starts empty every time.
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  school-db:
